<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" style="color: #2563EB;">
  <defs>
    <!-- Dynamic Sheen Overlay -->
    <linearGradient id="nexus_sheen" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22" />
    </linearGradient>

    <!-- Diagonal Dynamic Ribbon Gradient -->
    <linearGradient id="nexus_ribbon" x1="12" y1="11" x2="36" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <!-- Inner Ambient Glow and Drop Shadow -->
    <filter id="nexus_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.75" stdDeviation="1.5" flood-color="#020617" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Base Adaptive Squircle Badge -->
  <rect width="48" height="48" rx="12.5" fill="currentColor" />
  <rect width="48" height="48" rx="12.5" fill="url(#nexus_sheen)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.75" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.5" />

  <!-- Nexus Dimensional Emblem -->
  <g filter="url(#nexus_shadow)">
    <!-- Left Pillar -->
    <rect x="12" y="11" width="6.5" height="26" rx="3.25" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Right Pillar -->
    <rect x="29.5" y="11" width="6.5" height="26" rx="3.25" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Diagonal Velocity Ribbon (Interlocking Bridge) -->
    <path
      d="M 12 14.25 C 12 12.45 13.45 11 15.25 11 L 18.5 11 L 36 33.75 C 36 35.55 34.55 37 32.75 37 L 29.5 37 L 12 14.25 Z"
      fill="url(#nexus_ribbon)"
    />
  </g>
</svg>